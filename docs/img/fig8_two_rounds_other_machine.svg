<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 938" width="960" height="938" font-family="Helvetica,Arial,sans-serif" role="img" aria-label="The same conversation, round by round, over several machines">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker></defs>
<rect width="960" height="938" fill="#ffffff"/>
<text x="480.0" y="28" text-anchor="middle" font-size="18" fill="#1f2937" font-weight="700">The same conversation, round by round, over several machines</text>
<text x="480.0" y="48" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="400">Round 2 and round n are sent to another machine; the router moves the saved state when that is faster than computing it.</text>
<rect x="0" y="70" width="160" height="44" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="80.0" y="87.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">Client</text>
<text x="80.0" y="104.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">Cline · OpenCode</text>
<rect x="190" y="70" width="160" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="270.0" y="87.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">Router</text>
<text x="270.0" y="104.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">one URL (:8000)</text>
<rect x="390" y="70" width="160" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470.0" y="87.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">GB10</text>
<text x="470.0" y="104.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">server A</text>
<rect x="590" y="70" width="160" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="670.0" y="87.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">V100</text>
<text x="670.0" y="104.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">server B</text>
<rect x="780" y="70" width="160" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="860.0" y="87.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">PC store</text>
<text x="860.0" y="104.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">copies (:8082)</text>
<rect x="14" y="130" width="932" height="232" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
<text x="26" y="150" text-anchor="start" font-size="13" fill="#d97706" font-weight="700">ROUND 1</text>
<rect x="14" y="368" width="932" height="300" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="26" y="388" text-anchor="start" font-size="13" fill="#2563eb" font-weight="700">ROUND 2</text>
<rect x="14" y="674" width="932" height="164" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="26" y="694" text-anchor="start" font-size="13" fill="#7c3aed" font-weight="700">ROUND n</text>
<line x1="80" y1="114" x2="80" y2="870" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="270" y1="114" x2="270" y2="870" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="470" y1="114" x2="470" y2="870" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="670" y1="114" x2="670" y2="870" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="860" y1="114" x2="860" y2="870" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="84" y1="179.0" x2="266" y2="179.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="175.0" y="171.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">request, 23,300 tokens</text>
<line x1="274" y1="213.0" x2="466" y2="213.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="370.0" y="205.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">forward</text>
<rect x="360" y="229.0" width="220" height="26" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="470" y="247.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="700">compute all, save state at 20,480</text>
<line x1="474" y1="281.0" x2="856" y2="281.0" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
<text x="665.0" y="273.0" text-anchor="middle" font-size="11.5" fill="#dc2626" font-weight="400">mirror a copy of the saved state</text>
<line x1="466" y1="315.0" x2="274" y2="315.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="370.0" y="307.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">answer</text>
<line x1="266" y1="349.0" x2="84" y2="349.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="175.0" y="341.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">answer</text>
<line x1="84" y1="417.0" x2="266" y2="417.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="175.0" y="409.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">whole history + new question</text>
<rect x="35" y="433.0" width="470" height="26" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="270" y="451.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="700">longest match 20,480 is on GB10 and the PC; GB10 is busy, V100 is free → V100</text>
<line x1="274" y1="485.0" x2="666" y2="485.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="470.0" y="477.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">run it; pull the prefix first</text>
<line x1="674" y1="519.0" x2="856" y2="519.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="765.0" y="511.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">pull saved state</text>
<line x1="856" y1="553.0" x2="674" y2="553.0" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
<text x="765.0" y="545.0" text-anchor="middle" font-size="11.5" fill="#15803d" font-weight="400">state, all pieces or nothing</text>
<rect x="550" y="569.0" width="240" height="26" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="670" y="587.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="700">restore 20,480, compute only 3,820 tokens</text>
<line x1="666" y1="621.0" x2="274" y2="621.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="470.0" y="613.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">answer: the same as on GB10</text>
<line x1="266" y1="655.0" x2="84" y2="655.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="175.0" y="647.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">answer</text>
<line x1="84" y1="723.0" x2="266" y2="723.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="175.0" y="715.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">history + new question</text>
<line x1="274" y1="757.0" x2="666" y2="757.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="470.0" y="749.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">V100 holds the longest match now (else GB10 / PC)</text>
<rect x="470" y="773.0" width="400" height="26" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="670" y="791.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="700">restore, compute only the new tail, save, mirror to the PC</text>
<line x1="666" y1="825.0" x2="84" y2="825.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="375.0" y="817.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">answer (through the router)</text>
<text x="480.0" y="884" text-anchor="middle" font-size="11.5" fill="#6b7280" font-weight="400">Measured (27B, 12,288-token prefix, 496 MB over Wi-Fi at 1.5 MB/s): the V100 restored it in 10.3 s; computing it cold took 40.2 s.</text>
<text x="480.0" y="906" text-anchor="middle" font-size="11.5" fill="#6b7280" font-weight="400">If the pull fails or the link is too slow (--pull cost), the V100 computes everything (same answer) or the router uses GB10. Nothing breaks.</text>
</svg>
