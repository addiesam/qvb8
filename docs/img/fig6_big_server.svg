<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" font-family="Helvetica,Arial,sans-serif" role="img" aria-label="A big GPU server: router, a trillion-parameter model split over many cards, replicas, shared pool, RAM store">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker></defs>
<rect width="960" height="690" fill="#ffffff"/>
<text x="480" y="28" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700">A big server (8 cards of 288 GB): one huge model split over 6 cards, replicas of another, shared pool, one router</text>
<rect x="330" y="44" width="300" height="40" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="480.0" y="68.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">Cline · OpenCode · any OpenAI client</text>
<line x1="480" y1="84" x2="480" y2="108" stroke="#1f2937" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="280" y="108" width="400" height="58" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="480.0" y="132.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">Router  (:8000)</text>
<text x="480.0" y="149.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">picks ONE server per request: model name, saved prefix, queue</text>
<rect x="20" y="196" width="920" height="360" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="480" y="216" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">One machine with 8 GPUs of 288 GB each (2.3 TB of GPU memory in total)</text>
<rect x="40" y="236" width="620" height="196" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<rect x="680" y="236" width="240" height="196" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="350.0" y="256" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">Model B  Qwen/Qwen3.8-2.4T-A95B  (2.4 trillion parameters, 95 B active per token)</text>
<text x="350.0" y="272" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="400">ONE server :8083 over 6 cards, layers split in order; its pack is not built yet</text>
<rect x="50" y="290" width="88" height="70" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="94.0" y="312.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="700">GPU 0</text>
<text x="94.0" y="328.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">layers</text>
<text x="94.0" y="344.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">1st sixth</text>
<line x1="138" y1="325" x2="150" y2="325" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="150" y="290" width="88" height="70" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="194.0" y="312.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="700">GPU 1</text>
<text x="194.0" y="328.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">layers</text>
<text x="194.0" y="344.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">2nd sixth</text>
<line x1="238" y1="325" x2="250" y2="325" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="250" y="290" width="88" height="70" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="294.0" y="312.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="700">GPU 2</text>
<text x="294.0" y="328.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">layers</text>
<text x="294.0" y="344.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">3rd sixth</text>
<line x1="338" y1="325" x2="350" y2="325" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="350" y="290" width="88" height="70" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="394.0" y="312.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="700">GPU 3</text>
<text x="394.0" y="328.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">layers</text>
<text x="394.0" y="344.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">4th sixth</text>
<line x1="438" y1="325" x2="450" y2="325" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="450" y="290" width="88" height="70" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="494.0" y="312.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="700">GPU 4</text>
<text x="494.0" y="328.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">layers</text>
<text x="494.0" y="344.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">5th sixth</text>
<line x1="538" y1="325" x2="550" y2="325" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="550" y="290" width="88" height="70" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="594.0" y="312.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="700">GPU 5</text>
<text x="594.0" y="328.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">layers</text>
<text x="594.0" y="344.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">last sixth</text>
<text x="350.0" y="382" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="400">estimated pack about 1.2 TB (our 27B QVB8R pack is 0.5 byte per parameter); 6 cards hold 1.7 TB, the rest is KV cache</text>
<text x="350.0" y="398" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="400">--pipeline auto  (every visible card, split by weight bytes); each token passes the 6 cards in order</text>
<text x="800.0" y="256" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">Model A  Qwen3.6-35B-A3B</text>
<text x="800.0" y="272" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="400">2 replicas: one card each</text>
<rect x="694" y="290" width="100" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="744.0" y="312.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="700">GPU 6</text>
<text x="744.0" y="328.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">:8080</text>
<text x="744.0" y="344.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">whole model</text>
<rect x="804" y="290" width="100" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="854.0" y="312.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="700">GPU 7</text>
<text x="854.0" y="328.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">:8081</text>
<text x="854.0" y="344.6666666666667" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">whole model</text>
<text x="800.0" y="382" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="400">same pack on both cards:</text>
<text x="800.0" y="398" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="400">more users at once</text>
<line x1="400" y1="166" x2="350" y2="236" stroke="#1f2937" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="560" y1="166" x2="800" y2="236" stroke="#1f2937" stroke-width="2.5" marker-end="url(#a)"/>
<text x="695" y="114" text-anchor="start" font-size="11" fill="#7c3aed" font-weight="400">Why mix? Each model is its own server</text>
<text x="695" y="129" text-anchor="start" font-size="11" fill="#7c3aed" font-weight="400">on its own cards. The router picks by</text>
<text x="695" y="144" text-anchor="start" font-size="11" fill="#7c3aed" font-weight="400">the request's model name: a big model</text>
<text x="695" y="159" text-anchor="start" font-size="11" fill="#7c3aed" font-weight="400">for hard tasks, small for quick ones.</text>
<text x="335" y="198" text-anchor="end" font-size="11" fill="#7c3aed" font-weight="700">model = Qwen3.8-2.4T-A95B</text>
<text x="690" y="198" text-anchor="start" font-size="11" fill="#7c3aed" font-weight="700">model = Qwen3.6-35B-A3B</text>
<rect x="40" y="484" width="880" height="60" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="480.0" y="508" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">Shared prefix pool in host RAM  (/dev/shm): one pool per model, every server of that model reads and writes it</text>
<text x="480.0" y="525" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">A prefix saved by GPU 6 is restored by GPU 7 without copying; a host with 2 TB of RAM keeps very long conversations</text>
<line x1="350" y1="432" x2="350" y2="484" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
<line x1="800" y1="432" x2="800" y2="484" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
<rect x="250" y="590" width="460" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="480.0" y="613.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">Optional: a second machine or the same host's RAM</text>
<text x="480.0" y="630.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">prefix store :8082 (copies of saved prefixes) + KV host :8083 (overflow KV)</text>
<path d="M480 544 L480 590" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
<text x="500" y="574" text-anchor="start" font-size="11" fill="#dc2626" font-weight="400">mirror copies (red)</text>
<text x="480" y="676" text-anchor="middle" font-size="10.5" fill="#6b7280" font-weight="400">We have only simulated this layout; it has never run on such hardware. The settings extend the ones we ran (GB10, V100). Hardware donations welcome.</text>
</svg>
