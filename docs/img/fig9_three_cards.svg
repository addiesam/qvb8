<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica,Arial,sans-serif" role="img" aria-label="One 65B model over three 24 GB cards: each card holds a block of layers">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker></defs>
<rect width="960" height="470" fill="#ffffff"/>
<text x="480" y="28" text-anchor="middle" font-size="18" fill="#1f2937" font-weight="700">One big model over three 24 GB cards: each card holds a block of consecutive layers</text>
<text x="480" y="48" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="400">Example: Ripple-65B (80 layers), QVB8R 2e-3 pack 38 GB + DFlash2 drafter 3.4 GB. Layer numbers are the expected split, not measured.</text>
<rect x="60" y="70" width="200" height="52" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="160.0" y="91.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">Client</text>
<text x="160.0" y="108.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">prompt tokens in</text>
<rect x="60" y="150" width="240" height="170" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="180" y="174" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">GPU 0 (24 GB)</text>
<text x="180" y="198" text-anchor="middle" font-size="13" fill="#4338ca" font-weight="700">layers 0 – 26</text>
<text x="180" y="218" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">embedding + 27 layers</text>
<text x="180" y="238" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">≈ 12.8 GB weights</text>
<rect x="80" y="252" width="200" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
<text x="180" y="269" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="400">KV cache of its own layers (qvb8 compressed)</text>
<rect x="80" y="282" width="200" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
<text x="180" y="299" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="400">free: the rest of the 24 GB</text>
<rect x="360" y="150" width="240" height="170" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="480" y="174" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">GPU 1 (24 GB)</text>
<text x="480" y="198" text-anchor="middle" font-size="13" fill="#4338ca" font-weight="700">layers 27 – 53</text>
<text x="480" y="218" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">27 layers</text>
<text x="480" y="238" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">≈ 12.8 GB weights</text>
<rect x="380" y="252" width="200" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
<text x="480" y="269" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="400">KV cache of its own layers (qvb8 compressed)</text>
<rect x="380" y="282" width="200" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
<text x="480" y="299" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="400">free: the rest of the 24 GB</text>
<rect x="660" y="150" width="240" height="170" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="780" y="174" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">GPU 2 (24 GB)</text>
<text x="780" y="198" text-anchor="middle" font-size="13" fill="#4338ca" font-weight="700">layers 54 – 79</text>
<text x="780" y="218" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">26 layers + final norm + output head</text>
<text x="780" y="238" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">≈ 12.4 GB weights + drafter 3.4 GB</text>
<rect x="680" y="252" width="200" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
<text x="780" y="269" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="400">KV cache of its own layers (qvb8 compressed)</text>
<rect x="680" y="282" width="200" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
<text x="780" y="299" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="400">free: the rest of the 24 GB</text>
<line x1="160" y1="122" x2="160" y2="150" stroke="#1f2937" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="300" y1="235" x2="360" y2="235" stroke="#1f2937" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="600" y1="235" x2="660" y2="235" stroke="#1f2937" stroke-width="2.5" marker-end="url(#a)"/>
<text x="330" y="222" text-anchor="middle" font-size="10.5" fill="#4338ca" font-weight="700">hidden</text>
<text x="330" y="262" text-anchor="middle" font-size="10.5" fill="#4338ca" font-weight="700">state</text>
<text x="630" y="222" text-anchor="middle" font-size="10.5" fill="#4338ca" font-weight="700">hidden</text>
<text x="630" y="262" text-anchor="middle" font-size="10.5" fill="#4338ca" font-weight="700">state</text>
<line x1="780" y1="150" x2="780" y2="126" stroke="#1f2937" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="680" y="70" width="200" height="52" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="780.0" y="91.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">Next token</text>
<text x="780.0" y="108.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">back to the client</text>
<text x="480" y="350" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">Each token goes through the three cards in order. Only one hidden-state vector per token crosses between cards (kilobytes, not the weights),</text>
<text x="480" y="368" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">so a PCIe link or even a LAN is enough. Several requests in flight keep all three cards busy.</text>
<rect x="60" y="386" width="840" height="64" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
<text x="80" y="408" text-anchor="start" font-size="11.5" fill="#1f2937" font-weight="400">CUDA_VISIBLE_DEVICES=0,1,2  scripts/ripple_server.sh start --pipeline auto        # every visible card, split by weight bytes + free memory</text>
<text x="80" y="428" text-anchor="start" font-size="11.5" fill="#1f2937" font-weight="400">scripts/ripple_server.sh start --pipeline cuda:0,cuda:1,cuda:2 --pipeline-split 27,54   # or choose the first layer of cards 2 and 3 yourself</text>
<text x="80" y="444" text-anchor="start" font-size="10.5" fill="#6b7280" font-weight="400">(--pipeline-reserve-mb keeps free memory on each card; the default is 2048 MB)</text>
</svg>
