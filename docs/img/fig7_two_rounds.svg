<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 858" width="960" height="858" font-family="Helvetica,Arial,sans-serif" role="img" aria-label="Round 1, round 2 … round n with an agent client">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker></defs>
<rect width="960" height="858" fill="#ffffff"/>
<text x="480.0" y="28" text-anchor="middle" font-size="18" fill="#1f2937" font-weight="700">Round 1, round 2 … round n with an agent client</text>
<text x="480.0" y="48" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="400">Example numbers: 27B on a GB10, prefill about 880 tokens/s, chunk 4096. The client keeps the history; the server keeps none.</text>
<rect x="60" y="70" width="160" height="44" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="140.0" y="87.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">Client</text>
<text x="140.0" y="104.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">Cline · OpenCode</text>
<rect x="400" y="70" width="160" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="480.0" y="87.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">Server</text>
<text x="480.0" y="104.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">one qvb8 server</text>
<rect x="740" y="70" width="160" height="44" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="820.0" y="87.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">Pool</text>
<text x="820.0" y="104.5" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">saved state (host RAM)</text>
<rect x="14" y="130" width="932" height="232" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
<text x="26" y="150" text-anchor="start" font-size="13" fill="#d97706" font-weight="700">ROUND 1</text>
<rect x="14" y="368" width="932" height="232" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="26" y="388" text-anchor="start" font-size="13" fill="#2563eb" font-weight="700">ROUND 2</text>
<rect x="14" y="606" width="932" height="130" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="26" y="626" text-anchor="start" font-size="13" fill="#7c3aed" font-weight="700">ROUND n</text>
<line x1="140" y1="114" x2="140" y2="768" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="480" y1="114" x2="480" y2="768" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="820" y1="114" x2="820" y2="768" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="144" y1="179.0" x2="476" y2="179.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="310.0" y="171.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">prompt 23,300 tokens (system+tools, files, question)</text>
<line x1="484" y1="213.0" x2="816" y2="213.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="650.0" y="205.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">look up the token ids</text>
<line x1="816" y1="247.0" x2="484" y2="247.0" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
<text x="650.0" y="239.0" text-anchor="middle" font-size="11.5" fill="#dc2626" font-weight="400">nothing saved</text>
<rect x="310" y="263.0" width="340" height="26" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="480" y="281.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="700">compute all 23,300 tokens (about 26 s)</text>
<line x1="484" y1="315.0" x2="816" y2="315.0" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
<text x="650.0" y="307.0" text-anchor="middle" font-size="11.5" fill="#15803d" font-weight="400">save state at 20,480 tokens (chunk multiple)</text>
<line x1="476" y1="349.0" x2="144" y2="349.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="310.0" y="341.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">answer (600 tokens)</text>
<line x1="144" y1="417.0" x2="476" y2="417.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="310.0" y="409.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">WHOLE history again + new question = 24,300 tokens</text>
<line x1="484" y1="451.0" x2="816" y2="451.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="650.0" y="443.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">look up: the first 20,480 token ids are the same</text>
<line x1="816" y1="485.0" x2="484" y2="485.0" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
<text x="650.0" y="477.0" text-anchor="middle" font-size="11.5" fill="#15803d" font-weight="400">found: 20,480 tokens restored, not computed</text>
<rect x="290" y="501.0" width="380" height="26" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="480" y="519.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="700">compute only the other 3,820 tokens (about 4.3 s)</text>
<line x1="484" y1="553.0" x2="816" y2="553.0" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
<text x="650.0" y="545.0" text-anchor="middle" font-size="11.5" fill="#15803d" font-weight="400">save a longer state</text>
<line x1="476" y1="587.0" x2="144" y2="587.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="310.0" y="579.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">answer: the same as without any saving</text>
<line x1="144" y1="655.0" x2="476" y2="655.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="310.0" y="647.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">history grows; the same steps as round 2</text>
<rect x="230" y="671.0" width="500" height="26" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="480" y="689.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="700">restore the longest match, compute only the new tail, save again</text>
<line x1="476" y1="723.0" x2="144" y2="723.0" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="310.0" y="715.0" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">answer</text>
<text x="480.0" y="782" text-anchor="middle" font-size="11.5" fill="#6b7280" font-weight="400">Cost of a round = the new tail only (here 4.3 s instead of 27.6 s for the whole history), not the whole history.</text>
<text x="480.0" y="804" text-anchor="middle" font-size="11.5" fill="#6b7280" font-weight="400">The match needs IDENTICAL tokens from the start. A changed system prompt, tool list, mode, date line, template or think flag</text>
<text x="480.0" y="826" text-anchor="middle" font-size="11.5" fill="#6b7280" font-weight="400">ends the match at that point, and everything after it is computed again. Appending is cheap, editing the beginning is not.</text>
</svg>
