<rect x="1020" y="215" width="160" height="425" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="1100" y="262" text-anchor="middle" font-size="12.5" fill="#6b7280" font-weight="700">+ more clusters</text>
<text x="1100" y="290" text-anchor="middle" font-size="10.5" fill="#6b7280" font-weight="400">add as many as you</text>
<text x="1100" y="306" text-anchor="middle" font-size="10.5" fill="#6b7280" font-weight="400">need: same pack, own GPUs;</text>
<text x="1100" y="322" text-anchor="middle" font-size="10.5" fill="#6b7280" font-weight="400">register each one in the</text>
<text x="1100" y="338" text-anchor="middle" font-size="10.5" fill="#6b7280" font-weight="400">router with --backend.</text>
<text x="1100" y="354" text-anchor="middle" font-size="10.5" fill="#6b7280" font-weight="400">Each stays isolated.</text>
<rect x="40" y="720" width="1140" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="610.0" y="749.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">Super DRAM pool: PCs / servers with a lot of RAM (terabytes), no GPU</text>
<text x="610.0" y="766.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">prefix store :8082 (a copy of every saved prefix)   +   KV host :8083 (the old KV blocks that a cluster pushed out of GPU memory)</text>
<text x="610.0" y="783.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">the router lists the pool and pulls a saved prefix to the cluster that needs it, when copying is faster than computing</text>
<line x1="150" y1="640" x2="150" y2="720" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
<line x1="390" y1="640" x2="390" y2="720" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
<line x1="640" y1="640" x2="640" y2="720" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
<line x1="880" y1="640" x2="880" y2="720" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
<text x="1100" y="676" text-anchor="middle" font-size="11" fill="#15803d" font-weight="700">↓ offload: old KV</text>
<text x="1100" y="692" text-anchor="middle" font-size="11" fill="#15803d" font-weight="700">blocks, saved prefixes</text>
<rect x="14" y="818" width="1172" height="70" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
<text x="600.0" y="840" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">Tested: replicas, router, a RAM pool (PC store, KV host), a split over 2 cards and over 2 machines. Simulated only: a split over more than 2 cards,</text>
<text x="600.0" y="858" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">288 GB cards, many clusters. Pack sizes of Model 1 are estimates (0.5 byte per parameter); its pack is not built yet.</text>
<text x="600.0" y="876" text-anchor="middle" font-size="11.5" fill="#b45309" font-weight="700">Real tests need hardware: a donated card, GPU server access, or money for rented GPU time (see Support this project).</text>
</svg>
