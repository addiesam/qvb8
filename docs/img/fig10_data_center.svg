<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Helvetica,Arial,sans-serif" role="img" aria-label="A data center: many isolated clusters in parallel, each cluster holds one model over several GPUs, all offloading to a super DRAM pool">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker></defs>
<rect width="1200" height="900" fill="#ffffff"/>
<text x="600.0" y="28" text-anchor="middle" font-size="18" fill="#1f2937" font-weight="700">A data center: clusters run in parallel, each cluster = one model over several GPUs, one super DRAM pool</text>
<text x="600.0" y="48" text-anchor="middle" font-size="12" fill="#6b7280" font-weight="400">Inside a cluster the data goes down from GPU to GPU. Between clusters there is no traffic: every cluster is isolated.</text>
<rect x="450" y="58" width="300" height="38" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<text x="600.0" y="81.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="400">Cline · OpenCode · apps · many users</text>
