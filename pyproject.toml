[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qvb8"
version = "1.1.0"
description = "QVB8: certified-error compressed weights and a fast inference engine for large AI models (first supported model: Ripple-65B)"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sam, Chi Ngai" }]
dependencies = ["torch>=2.14", "triton>=3.8", "transformers>=5.17", "accelerate", "safetensors", "numpy", "psutil", "pillow", "ninja"]

[project.urls]
Homepage = "https://github.com/addiesam/qvb8"
Paper = "https://doi.org/10.5281/zenodo.23815007"
Sponsor = "https://github.com/sponsors/addiesam"

[project.optional-dependencies]
flash = ["flash-attn>=2.8"]

[project.scripts]
ripple-serve = "ai_engine.cli.serve:main"
ripple-chat = "ai_engine.cli.chat_client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.cu", "*.cpp", "*.cuh", "*.h"]
